name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OCR languages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -ra

  windows-first-start:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: First start from a project without a virtual environment
        run: cmd /d /c start_redactor.bat --setup-only
      - name: Launcher, file cleanup and real model checks
        run: .venv/Scripts/python.exe -m pytest tests/test_launcher.py tests/test_pdf_handles.py tests/test_installed_model.py -ra

